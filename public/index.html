<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E6E2DA" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Bay — phone remote for your garage door" />
  <title>Bay — Garage Remote</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="app">
    <header class="brand">
      <div class="mark" aria-hidden="true">
        <span class="mark-bar"></span>
        <span class="mark-bar"></span>
        <span class="mark-bar"></span>
      </div>
      <h1>Bay</h1>
    </header>

    <section id="lock-screen" class="screen lock-screen" aria-label="Passcode unlock">
      <p class="lede">Enter your garage passcode to take the remote.</p>
      <form id="unlock-form" class="pin-form" autocomplete="off">
        <label class="sr-only" for="pin">Passcode</label>
        <input
          id="pin"
          name="pin"
          type="tel"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]*"
          maxlength="12"
          placeholder="••••"
          required
          autofocus
        />
        <button type="submit" class="btn primary">Unlock remote</button>
      </form>
      <p id="lock-error" class="error" hidden></p>
    </section>

    <section id="remote-screen" class="screen remote-screen" hidden aria-label="Garage remote">
      <div class="door-stage" aria-live="polite">
        <div class="bay-frame">
          <div id="door" class="door closed">
            <div class="panel"></div>
            <div class="panel"></div>
            <div class="panel"></div>
            <div class="panel"></div>
            <div class="handle"></div>
          </div>
          <div class="interior"></div>
        </div>
        <p id="status-label" class="status">Closed</p>
      </div>

      <div class="controls" role="group" aria-label="Door controls">
        <button type="button" class="btn action open" data-action="open">Open</button>
        <button type="button" class="btn action close" data-action="close">Close</button>
      </div>

      <button type="button" id="toggle-btn" class="btn ghost" data-action="toggle">Pulse wall button</button>
      <button type="button" id="lock-btn" class="btn text">Lock remote</button>
      <p id="remote-msg" class="msg" hidden></p>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
